<!doctype html>
<!-- The share card (Open Graph / Twitter image), 600x315 CSS pixels, rendered at 2x to
     images/share-card.png (1200x630) by:
       node tools/shoot.mjs images/share-card.png --url "file://$PWD/tools/share-card.html" --width 600 --height 315 --wait 1500
     It reuses the page's colors, fonts, and the hero's miniature job graph. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>The streaming kitchen: share card</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400&family=Poppins:wght@500;600&display=block" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff; --panel: #f3f6fb; --ink: #10203a; --ink-2: #4a5872; --ink-3: #7a879c;
    --rule: #d6deea; --blue: #0056f9; --blue-soft: #e5edff; --violet: #7b3fe4; --violet-soft: #efe7fd;
    --wm: #ffdc00; --wm-ink: #3d3200; --wm-line: #c9a800; --node: #ffffff;
  }
  html, body { margin: 0; width: 600px; height: 315px; overflow: hidden; background: var(--paper); }
  .card {
    box-sizing: border-box; width: 600px; height: 315px; padding: 28px 34px 18px;
    display: grid; grid-template-columns: 1fr 196px; grid-template-rows: 1fr auto; column-gap: 26px;
  }
  .text { align-self: center; }
  h1 { margin: 0; color: var(--ink); font: 600 41px/1.04 Poppins, sans-serif; letter-spacing: -0.025em; }
  .sub { margin: 14px 0 0; color: var(--ink); font: 500 15px/1.32 Poppins, sans-serif; }
  .sub span { display: inline-block; text-wrap: balance; }
  .lede { margin: 12px 0 0; color: var(--ink-2); font: 400 12.5px/1.5 'IBM Plex Sans', sans-serif; max-width: 34ch; }
  svg { align-self: center; justify-self: end; width: 196px; height: auto; overflow: visible; }
  .url {
    grid-column: 1 / -1; margin-top: 14px; padding-top: 9px; border-top: 1px solid var(--rule);
    color: var(--ink-3); font: 500 10.5px 'IBM Plex Mono', monospace;
  }
  .hg-node { fill: var(--node); stroke: var(--ink-3); stroke-width: 1.5; }
  .hg-state-bar { fill: var(--blue); }
  .hg-line { fill: var(--ink-3); opacity: 0.55; }
  .hg-dim { opacity: 0.3; }
  .hg-edge { fill: none; stroke-width: 2.5; }
  .append { stroke: var(--blue); }
  .upsert { stroke: var(--violet); }
  .hg-arrow.append, .dot.append { fill: var(--blue); stroke: none; }
  .hg-arrow.upsert, .dot.upsert { fill: var(--violet); stroke: none; }
  .hg-tie { stroke: var(--rule); stroke-width: 1.5; }
  .hg-panel { fill: var(--panel); stroke: var(--rule); stroke-width: 1.5; }
  .hg-key { fill: var(--ink-3); opacity: 0.45; }
  .hg-val { fill: var(--blue); opacity: 0.35; }
  .hg-val.hot { opacity: 1; }
  .chip rect { stroke-width: 1.5; }
  .chip text { font: 500 10.5px 'IBM Plex Mono', monospace; }
  .chip.append rect { fill: var(--blue-soft); stroke: var(--blue); }
  .chip.append text { fill: var(--blue); }
  .chip.upsert rect { fill: var(--violet-soft); stroke: var(--violet); }
  .chip.upsert text { fill: var(--violet); }
  .wm rect { fill: var(--wm); }
  .wm text { font: 600 9.5px 'IBM Plex Mono', monospace; fill: var(--wm-ink); }
</style>
</head>
<body>
  <div class="card">
    <div class="text">
      <h1>The streaming<br>kitchen</h1>
      <p class="sub"><span>Apache&nbsp;Flink® SQL for pizza shops:</span> <span>the recipes, and the science behind&nbsp;them</span></p>
      <p class="lede">Every operator, every row, every piece of state, and every timer, step by step.</p>
    </div>
    <!-- The hero's job graph, drawn top to bottom as the page draws it on phones: append-only in,
         a stateful operator with its state, upsert out, and a watermark. -->
    <svg viewBox="0 0 196 250" aria-hidden="true">
      <defs><clipPath id="op"><rect x="1" y="98" width="104" height="48" rx="9"/></clipPath></defs>
      <path class="hg-edge append" d="M53 50V90"/>
      <path class="hg-arrow append" d="M47.5 89 53 98 58.5 89Z"/>
      <path class="hg-edge upsert" d="M53 146V186"/>
      <path class="hg-arrow upsert" d="M47.5 185 53 194 58.5 185Z"/>
      <circle class="dot append" cx="53" cy="68" r="5.5"/>
      <circle class="dot upsert" cx="53" cy="168" r="5.5"/>
      <g class="chip append" transform="translate(82 70)">
        <rect x="-17" y="-10" width="34" height="20" rx="10"/>
        <text x="0" y="3.5" text-anchor="middle">+I</text>
      </g>
      <g class="chip upsert" transform="translate(99 174)">
        <rect x="-34" y="-10" width="68" height="20" rx="10"/>
        <text x="0" y="3.5" text-anchor="middle">+I +U −D</text>
      </g>
      <g class="wm" transform="translate(150 70)">
        <rect x="-44" y="-10" width="88" height="20" rx="3"/>
        <text x="0" y="3.5" text-anchor="middle">WM 12:05:00</text>
      </g>
      <rect class="hg-node" x="1" y="2" width="104" height="48" rx="9"/>
      <rect class="hg-line" x="18" y="18" width="58" height="7" rx="3.5"/>
      <rect class="hg-line hg-dim" x="18" y="31" width="40" height="6" rx="3"/>
      <rect class="hg-node" x="1" y="98" width="104" height="48" rx="9"/>
      <rect class="hg-state-bar" x="1" y="98" width="5" height="48" clip-path="url(#op)"/>
      <rect class="hg-line" x="20" y="114" width="62" height="7" rx="3.5"/>
      <rect class="hg-line hg-dim" x="20" y="127" width="44" height="6" rx="3"/>
      <path class="hg-tie" d="M105 122H118"/>
      <rect class="hg-panel" x="118" y="96" width="76" height="56" rx="8"/>
      <rect class="hg-key" x="128" y="106" width="10" height="7" rx="3.5"/>
      <rect class="hg-key" x="128" y="120" width="10" height="7" rx="3.5"/>
      <rect class="hg-key" x="128" y="134" width="10" height="7" rx="3.5"/>
      <rect class="hg-val" x="144" y="106" width="36" height="7" rx="3.5"/>
      <rect class="hg-val hot" x="144" y="120" width="24" height="7" rx="3.5"/>
      <rect class="hg-val" x="144" y="134" width="42" height="7" rx="3.5"/>
      <rect class="hg-node" x="1" y="194" width="104" height="48" rx="9"/>
      <rect class="hg-line" x="18" y="210" width="54" height="7" rx="3.5"/>
      <rect class="hg-line hg-dim" x="18" y="223" width="36" height="6" rx="3"/>
    </svg>
    <div class="url">github.com/alpinegizmo/streaming-kitchen</div>
  </div>
</body>
</html>
